# =============================================================
# Monthly data update
#
# Runs the backend pipeline on the 1st of each month:
#   1. assemble_data.py  pulls FRED, FCI-G, HLW, and builds the
#                        quarterly panel.
#   2. estimate_CCS_struct.py  runs the Kalman estimation and
#                              writes backend/data/output/.
#   3. the FULL daily nowcast/forecast chain, re-run on top of the new
#      estimates (see "Refresh the nowcast" below for why).
#
# If any output file changed, the workflow commits and pushes to
# main. That push then triggers deploy.yml, which redeploys the
# live site at fcistar.org.
#
# Also runnable on demand via the "Run workflow" button in the
# Actions tab (workflow_dispatch).
# =============================================================

name: Monthly data update

on:
  schedule:
    # 18:00 UTC on the 1st of every month (~1-2pm US Eastern).
    # The Fed Board republishes the FCI-G public CSVs around 14:00 UTC
    # on the 1st with the previous month's value. Firing earlier (e.g.
    # 06:00 UTC) caused us to pull a stale FCI-G file and miss the most
    # recent quarter -- see 2026-05-01 cron run, which produced
    # sample_end = 2025Q4 instead of 2026Q1.
    - cron: '0 18 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/pipeline/requirements.txt

      - name: Assemble data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python backend/pipeline/assemble_data.py

      - name: Run estimation
        working-directory: backend/pipeline
        run: python estimate_CCS_struct.py

      # The estimation advances the last estimated quarter, which invalidates
      # EVERY artifact the daily cron owns: fcistar_forecast.csv still targets
      # the quarter that just printed as an actual, and fci_nowcast.csv /
      # fci_components.csv still start their monthly-official rows after the
      # PREVIOUS last quarter, so they overlap the quarterly series. Committing
      # the estimation on its own publishes that inconsistent bundle and the
      # deploy ships it -- the site then shows a superseded SPF forecast next to
      # the actual estimate for the same quarter, with the charts doubling back
      # on themselves, until the next weekday nowcast run repairs it (up to 3
      # days when the 1st falls on a weekend -- 2026-08-01 did exactly this).
      # Re-running the daily chain here makes the monthly update one atomic,
      # internally consistent commit.
      - name: Refresh the nowcast and forecast on top of the new estimates
        working-directory: backend/pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python get_fcig.py
          python daily_backcast.py
          python nowcast_fcig.py
          python get_spf.py
          python forecast_fcistar.py
          python build_fci_nowcast.py

      - name: Commit and push if outputs changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add backend/data/output/

          if git diff --cached --quiet; then
            echo "No changes to outputs."
            exit 0
          fi

          SAMPLE_END=$(python -c "import json; print(json.load(open('backend/data/output/metadata.json'))['sample_end'])")
          git commit -m "Monthly data update (sample end $SAMPLE_END)"
          git push
